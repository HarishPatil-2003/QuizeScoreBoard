# ========================================================
# Quiz Score Board - Database Configuration (Supabase)
# ========================================================
# You can connect to Supabase either by setting:
# 1. Environment variable SUPABASE_DB_URL or DATABASE_URL
# 2. Or setting the properties below in this file:

# --- Option A: Full Supabase Connection String / JDBC URL ---
# (From Supabase Dashboard -> Project Settings -> Database -> Connection string -> JDBC or URI)
# Example (Direct):
# supabase.db.url=jdbc:postgresql://db.YOUR_PROJECT_REF.supabase.co:5432/postgres?sslmode=require
#
# Example (Transaction Pooler - IPv4 friendly):
# supabase.db.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:6543/postgres?sslmode=require
supabase.db.url=

# --- Option B: Credentials ---
# Note: In Supabase pooler mode, username is typically 'postgres.YOUR_PROJECT_REF'
supabase.db.user=postgres
supabase.db.password=your_supabase_password_here

# Default fallback server port (can also be set with environment variable PORT)
server.port=8080
